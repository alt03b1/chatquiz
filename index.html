<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ChatQuiz</title>
  <style>
    :root {
      --bg: #22262b;
      --panel: #22262b;          /* keep cards same as bg for flat look */
      --panel2: #22262b;
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --border: rgba(255,255,255,0.12);

      --choiceBg: #1a1d22;       /* answer choice buttons */
      --btn: #1a1d22;            /* normal buttons */
      --btnHover: rgba(255,255,255,0.08);

      --good: #1aa64a;           /* correct outline */
      --bad: #b3261e;            /* wrong outline */

      --shadow: none;            /* flat */
      --radius: 18px;
      --radius2: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }


    .wrap {
      width: 980px;
      max-width: 100%;
      display: grid;
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border-bottom: 1px solid var(--border);
    }

    .header .meta {
      font-size: 13px;
      color: var(--muted);
    }

    .content { padding: 18px 20px; }

    textarea {
      width: 100%;
      min-height: 240px;
      resize: vertical;
      background: rgba(0,0,0,0.25);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      padding: 12px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.4;
      outline: none;
    }
    textarea:focus { border-color: rgba(255,255,255,0.22); }

    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .toggleLabel {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .toggleLabel input {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: #4259ff;
      cursor: pointer;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      transition: background 120ms ease, transform 120ms ease, opacity 120ms ease;
      user-select: none;
    }
    button:hover { background: var(--btnHover); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .danger { border-color: rgba(239,68,68,0.35); }
    .success { border-color: rgba(34,197,94,0.35); }

    .error {
      margin-top: 10px;
      color: rgba(255,255,255,0.88);
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      padding: 10px 12px;
      border-radius: var(--radius2);
      display: none;
      white-space: pre-wrap;
      font-size: 13px;
    }

    .progress {
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
    }
    .progress > div {
      height: 100%;
      width: 0%;
      background: rgba(255,255,255,0.45);
      transition: width 180ms ease;
    }

    .qStem {
      margin: 12px 0 16px;
      color: rgba(255,255,255,0.94);
      font-size: 18px;     /* match .choiceText */
      line-height: 1.35;   /* match .choiceText */
      font-weight: 700;    /* bold */
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choiceRow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: stretch;
    }

    .choiceBtn {
      width: 100%;
      text-align: left;
      border-radius: var(--radius2);
      padding: 14px 14px;
      background: var(--choiceBg);
      border: 1px solid rgba(255,255,255,0.10);
      display: flex;
      gap: 10px;
      align-items: flex-start;
      transition: border-color 140ms ease, background 140ms ease;
    }
    .choiceBtn:hover { background: rgba(255,255,255,0.06); }
    .choiceBtn:disabled { opacity: 1; cursor: default; }

    .choiceBtn.eliminated {
      opacity: 0.38;
      text-decoration: line-through;
      cursor: not-allowed;
    }

    .eliminateBtn {
      width: 46px;
      padding: 0;
      border-radius: var(--radius2);
      font-size: 19px;
      line-height: 1;
    }

    .eliminateBtn[aria-pressed="true"] { opacity: 0.55; }

    .choiceText {
      color: rgba(255,255,255,0.92);
      line-height: 1.35;
      font-size: 18px;     /* same as question */
      font-weight: 400;    /* not bold */
    }

    .outlineGood { border-color: var(--good) !important; }
    .outlineBad  { border-color: var(--bad) !important; }


    .footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .muted { color: var(--muted); font-size: 13px; }

    .pill {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      font-size: 12px;
      color: rgba(255,255,255,0.78);
    }

    /* Tutorial modal */
    .pillBtn {
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      font-size: 12px;
      color: rgba(255,255,255,0.92);
      font-weight: 700;
    }
    .pillBtn:hover { background: rgba(255,255,255,0.12); }

    .modalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      z-index: 999;
    }
    .modal {
      width: 980px;
      max-width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .modalHeader {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .modalTitle {
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    .modalBody { padding: 16px; display: grid; gap: 14px; }
    .smallTA { min-height: 340px; }
    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .modalClose {
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.0);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .modalClose:hover { background: rgba(255,255,255,0.06); }

    .hidden { display: none !important; }

    .endStats {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }
    .big {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25);
      color: rgba(255,255,255,0.8);
    }

    /* Specific button styling */
    #nextBtn {
      background: #4259ff;
      border: none;
    }

    #nextBtn:hover { filter: brightness(1.05); }
    #nextBtn:active { transform: translateY(1px); }

    #prevBtn,
    #explainBtn {
      background: var(--bg);
      border: 1px solid #25292e;
    }

    #prevBtn:hover,
    #explainBtn:hover {
      background: rgba(255,255,255,0.04);
    }

    /* Greyed out explain button when disabled */
    #explainBtn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }

  </style>
</head>
<body>
  <div class="wrap">

    <!-- LANDING -->
    <div id="landing" class="card">
      <div class="header">
        <div>
          <div style="font-weight:800; font-size:16px;">Paste Quiz Here</div>
          <div class="meta">Then hit <span class="kbd">Start</span>.</div>
        </div>
        <div class="row">
          <button id="savedBtn" class="pillBtn" type="button">Saved</button>
          <button id="tutorialBtn" class="pillBtn" type="button">Help</button>
        </div>
      </div>
      <div class="content">
        <textarea id="jsonInput" spellcheck="false" placeholder='1. Really hard example question?
A. Wrong answer
B. Right answer
C. Wrong answer
D. Wrong answer
E. Wrong answer

2. ...

Answer Key:
1. B
2. ...'></textarea>

        <div class="row" style="margin-top:12px;">
          <button id="startBtn" class="success">Start</button>
          <button id="saveBtn">Save</button>
          <button id="clearBtn" class="danger">Clear</button>
          <label class="toggleLabel" for="shuffleQuestionsInput">
            <input id="shuffleQuestionsInput" type="checkbox">
            Randomize question order
          </label>
        </div>
        <div id="errorBox" class="error"></div>
      </div>
    </div>

    <!-- QUIZ -->
    <div id="quiz" class="card hidden">
      <div class="header">
        <div class="meta" id="topMeta">Question</div>
        <div style="min-width:240px; width: 40%; max-width: 420px;">
          <div class="progress" title="Progress">
            <div id="progressBar"></div>
          </div>
        </div>
      </div>

      <div class="content">
        <div class="qStem" id="stem"></div>
        <div class="choices" id="choices"></div>
      </div>

      <div class="footer">
        <div class="row">
          <button id="explainBtn">Explain</button>
          <button id="excludeBtn" type="button" aria-pressed="false">Exclude</button>
        </div>

        <div class="row">
          <button id="prevBtn">Previous</button>
          <button id="nextBtn">Next</button>
        </div>
      </div>
    </div> <!-- close #quiz -->

    <!-- END -->
    <div id="end" class="card hidden">
      <div class="header">
        <div>
          <div style="font-weight:800; font-size:16px;">Done</div>
          <div class="meta">Yay.</div>
        </div>
        <div class="pill" id="endPill">0/0</div>
      </div>
      <div class="content">
        <div class="big" id="endPercent">0%</div>
        <div class="endStats">
          <div class="muted" id="endDetail">You got 0 right.</div>
        </div>
        <div class="row" style="margin-top:14px;">
          <button id="restartBtn" class="success">New Quiz</button>
          <button id="reviewBtn">Review</button>
          <button id="reviewIncorrectBtn">Review Incorrect</button>
        </div>
      </div>
    </div>

  </div>

  <!-- EXAMPLE PROMPT MODAL -->
  <div id="tutorialOverlay" class="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tutorialTitle">
      <div class="modalHeader">
        <div id="tutorialTitle" class="modalTitle">Example Prompt</div>
        <div class="row">
          <button id="copyExampleBtn" type="button">Copy</button>
          <button id="tutorialClose" class="modalClose" type="button">Close</button>
        </div>
      </div>
      <div class="modalBody">
        <textarea id="examplePrompt" class="smallTA" spellcheck="false" readonly></textarea>
      </div>
    </div>
  </div>
  
  <!-- SAVED BANKS MODAL -->
  <div id="savedOverlay" class="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="savedTitle">
      <div class="modalHeader">
        <div>
          <div id="savedTitle" class="modalTitle">Saved banks</div>
          <div class="hint">Loads into big box. Still need to press start.</div>
        </div>
        <button id="savedClose" class="modalClose" type="button">Close</button>
      </div>
      <div class="modalBody">
        <div id="savedList" class="card" style="border-radius: var(--radius2);">
          <div class="content" style="padding: 12px 14px;">
            <div class="muted">Loading…</div>
          </div>
        </div>
      </div>
    </div>
  </div>
<script>
  // ---------- State ----------
  let deck = null;              // { questions: [...] }
  let idx = 0;                  // current question index
  let selected = [];            // selected answer index per question (null if unanswered)
  let locked = [];              // whether question was answered/locked in
  let eliminated = [];          // eliminated answer choices per question
  let excluded = [];            // questions omitted from score calculations
  let reviewIndices = null;      // question indices when reviewing a filtered set
  const letters = ["A","B","C","D","E"];

  // ---------- Elements ----------
  const landingEl = document.getElementById("landing");
  const quizEl = document.getElementById("quiz");
  const endEl = document.getElementById("end");

  const jsonInput = document.getElementById("jsonInput");
  const startBtn = document.getElementById("startBtn");
  const clearBtn = document.getElementById("clearBtn");
  const shuffleQuestionsInput = document.getElementById("shuffleQuestionsInput");
  const errorBox = document.getElementById("errorBox");

  const topMeta = document.getElementById("topMeta");
  const progressBar = document.getElementById("progressBar");
  const stemEl = document.getElementById("stem");
  const choicesEl = document.getElementById("choices");

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const explainBtn = document.getElementById("explainBtn");
  const excludeBtn = document.getElementById("excludeBtn");

  const endPill = document.getElementById("endPill");
  const endPercent = document.getElementById("endPercent");
  const endDetail = document.getElementById("endDetail");
  const restartBtn = document.getElementById("restartBtn");
  const reviewBtn = document.getElementById("reviewBtn");
  const reviewIncorrectBtn = document.getElementById("reviewIncorrectBtn");

  // tutorial elements
  const tutorialBtn = document.getElementById("tutorialBtn");
  const tutorialOverlay = document.getElementById("tutorialOverlay");
  const tutorialClose = document.getElementById("tutorialClose");
  const copyExampleBtn = document.getElementById("copyExampleBtn");
  const examplePromptEl = document.getElementById("examplePrompt");

  // saved banks elements
  const savedBtn = document.getElementById("savedBtn");
  const saveBtn = document.getElementById("saveBtn");
  const savedOverlay = document.getElementById("savedOverlay");
  const savedClose = document.getElementById("savedClose");
  const savedList = document.getElementById("savedList");

  // saved banks state
  const SAVED_KEY = "chatquiz.savedBanks.v1";

  function safeJsonParse(s, fallback) {
    try { return JSON.parse(s); } catch { return fallback; }
  }

  function loadSavedBanks() {
    try {
      const raw = localStorage.getItem(SAVED_KEY);
      const arr = safeJsonParse(raw, []);
      return Array.isArray(arr) ? arr : [];
    } catch {
      return [];
    }
  }

  function persistSavedBanks(banks) {
    try {
      localStorage.setItem(SAVED_KEY, JSON.stringify(banks));
    } catch {
      throw new Error("Couldn’t save this bank. Browser storage may be disabled or full.");
    }
  }

  function makeId() {
    // crypto.randomUUID is supported in modern browsers; fallback if not.
    return globalThis.crypto?.randomUUID?.() || (Date.now() + "-" + Math.floor(Math.random() * 1e9));
  }

  function openSaved() {
    savedOverlay.style.display = "flex";
    savedOverlay.setAttribute("aria-hidden", "false");
    renderSavedList();
    savedClose.focus();
  }

  function closeSaved() {
    savedOverlay.style.display = "none";
    savedOverlay.setAttribute("aria-hidden", "true");
    savedBtn.focus();
  }

  function formatDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { year:"numeric", month:"short", day:"2-digit" });
    } catch { return ""; }
  }

  function renderSavedList() {
    const banks = loadSavedBanks()
      .sort((a,b) => (b.savedAt || "").localeCompare(a.savedAt || "")); // newest first

    const body = savedList.querySelector(".content");
    body.innerHTML = "";

    if (!banks.length) {
      const empty = document.createElement("div");
      empty.className = "muted";
      empty.textContent = "No saved banks yet. Paste one in, then hit Save.";
      body.appendChild(empty);
      return;
    }

    banks.forEach((bank) => {
      const row = document.createElement("div");
      row.style.display = "flex";
      row.style.alignItems = "center";
      row.style.justifyContent = "space-between";
      row.style.gap = "10px";
      row.style.padding = "10px 0";
      row.style.borderBottom = "1px solid var(--border)";

      const left = document.createElement("div");
      const title = document.createElement("div");
      title.style.fontWeight = "800";
      title.textContent = bank.title || "(untitled)";

      const meta = document.createElement("div");
      meta.className = "muted";
      meta.textContent = `${(bank.count || "") ? bank.count + " q • " : ""}${formatDate(bank.savedAt)}`;

      left.appendChild(title);
      left.appendChild(meta);

      const actions = document.createElement("div");
      actions.className = "row";

      const loadBtn = document.createElement("button");
      loadBtn.textContent = "Load";
      loadBtn.addEventListener("click", () => {
        jsonInput.value = bank.raw || "";
        clearError();
        closeSaved();
      });

      const delBtn = document.createElement("button");
      delBtn.textContent = "Delete";
      delBtn.className = "danger";
      delBtn.addEventListener("click", () => {
        if (!confirm(`Delete "${bank.title || "untitled"}"?`)) return;
        const next = loadSavedBanks().filter(b => b.id !== bank.id);
        try {
          persistSavedBanks(next);
          renderSavedList();
        } catch (e) {
          closeSaved();
          showError(e.message);
        }
      });

      actions.appendChild(loadBtn);
      actions.appendChild(delBtn);

      row.appendChild(left);
      row.appendChild(actions);
      body.appendChild(row);
    });

    // remove the last border for cleanliness
    const rows = body.querySelectorAll("div[style*='border-bottom']");
    if (rows.length) rows[rows.length - 1].style.borderBottom = "none";
  }

  function saveCurrentBank() {
    clearError();
    const raw = (jsonInput.value || "").trim();
    if (!raw) return showError("Nothing to save. Paste a quiz first.");

    const title = prompt("Title this bank:");
    if (title === null) return; // user cancelled

    const cleaned = (title || "").trim();
    if (!cleaned) return showError("Title can’t be empty.");

    // Optional: try to estimate count (works for JSON; harmless otherwise)
    let count = "";
    try {
      const maybe = parseAndValidateFlexible(raw);
      count = maybe?.questions?.length ? String(maybe.questions.length) : "";
    } catch (_) {}

    const banks = loadSavedBanks();

    // if title already exists, confirm overwrite
    const existingIdx = banks.findIndex(b => (b.title || "").toLowerCase() === cleaned.toLowerCase());
    if (existingIdx >= 0) {
      if (!confirm(`Overwrite existing bank named "${cleaned}"?`)) return;
      banks[existingIdx] = { ...banks[existingIdx], raw, savedAt: new Date().toISOString(), count };
    } else {
      banks.push({ id: makeId(), title: cleaned, raw, savedAt: new Date().toISOString(), count });
    }

    try {
      persistSavedBanks(banks);
    } catch (e) {
      return showError(e.message);
    }

    // tiny UX feedback
    const old = saveBtn.textContent;
    saveBtn.textContent = "Saved!";
    setTimeout(() => { saveBtn.textContent = old; }, 900);
  }

  // ---------- Helpers ----------

    // --- Random helpers (better than Math.random for shuffles) ---
  function shuffleInPlace(arr) {
    // Fisher–Yates
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function shuffleChoicesInDeck(d) {
    if (!d || !Array.isArray(d.questions)) return d;

    d.questions.forEach((q) => {
      if (!Array.isArray(q.choices) || q.choices.length !== 5) return;

      // permutation of indices 0..4
      const order = shuffleInPlace([0,1,2,3,4]);

      const newChoices = order.map(i => q.choices[i]);
      const newAnswerIndex = order.indexOf(q.answerIndex);

      q.choices = newChoices;
      q.answerIndex = newAnswerIndex;
    });

    return d;
  }

  function showError(msg) {
    errorBox.style.display = "block";
    errorBox.textContent = msg;
  }

  function clearError() {
    errorBox.style.display = "none";
    errorBox.textContent = "";
  }

  function openTutorial() {
    tutorialOverlay.style.display = "flex";
    tutorialOverlay.setAttribute("aria-hidden", "false");
    tutorialClose.focus();
  }

  function closeTutorial() {
    tutorialOverlay.style.display = "none";
    tutorialOverlay.setAttribute("aria-hidden", "true");
    tutorialBtn.focus();
  }

  async function copyToClipboard(text, onOkLabel, btnEl) {
    try {
      if (!navigator.clipboard?.writeText) throw new Error("Clipboard API unavailable");
      await navigator.clipboard.writeText(text);
      if (!btnEl) return;
      const old = btnEl.textContent;
      btnEl.textContent = onOkLabel || "Copied!";
      setTimeout(() => { btnEl.textContent = old; }, 900);
    } catch {
      window.prompt("Copy the text below:", text);
    }
  }

  const EXAMPLE_PROMPT =
`You are a medical educator helping a DO student prepare for the USMLE Step 1 and COMLEX Level 1 exams. Create 10 clinically relevant multiple-choice questions based only on the content in the presentation provided. Do not include any material that is not explicitly in the slides, even if it is related or appears in future courses.

Each question should:

- Use a brief clinical vignette format

- Include 5 answer choices labelled A-E with only one correct option

- Provide an answer key at the very end

- Do not label the questions, just number them

- Focus exclusively on the learning objectives and ensure the questions assess application-level knowledge, not just recall

- Whenever possible, write answer choices so that multiple options could appear correct, but only one is the best answer. If the learning objective is purely recall-based, a straightforward single correct answer is acceptable.`;

  // populate modal example textbox
  if (examplePromptEl) examplePromptEl.value = EXAMPLE_PROMPT;

  function validateDeck(obj) {
    if (!obj || typeof obj !== "object") throw new Error("Quiz must be an object.");
    if (!Array.isArray(obj.questions)) throw new Error('Missing "questions": [...] array.');
    if (obj.questions.length === 0) throw new Error("questions array is empty.");

    obj.questions.forEach((q, i) => {
      if (!q || typeof q !== "object") throw new Error(`Question ${i + 1} must be an object.`);
      if (typeof q.stem !== "string" || !q.stem.trim()) throw new Error(`Question ${i + 1} missing non-empty "stem".`);

      if (!Array.isArray(q.choices) || q.choices.length !== 5) {
        throw new Error(`Question ${i + 1} "choices" must be an array of 5 strings.`);
      }
      q.choices.forEach((c, j) => {
        if (typeof c !== "string" || !c.trim()) {
          throw new Error(`Question ${i + 1} choice ${letters[j]} must be a non-empty string.`);
        }
      });

      if (!Number.isInteger(q.answerIndex) || q.answerIndex < 0 || q.answerIndex > 4) {
        throw new Error(`Question ${i + 1} "answerIndex" must be an integer 0–4.`);
      }
    });

    return obj;
  }

  function parseAndValidateJson(raw) {
    let obj;
    try {
      obj = JSON.parse(raw);
    } catch (e) {
      throw new Error("Invalid JSON. Tip: no trailing commas, use double quotes.\n\n" + e.message);
    }
    return validateDeck(obj);
  }

  /**
  * Flexible entry point:
  * - try JSON first
  * - if JSON fails, try plaintext parsing (numbered Qs + A–E + answer key)
  */
  function parseAndValidateFlexible(raw) {
    const input = (raw || "").trim();
    if (!input) throw new Error("Paste a quiz first.");

    // 1) JSON path (unchanged behavior if valid)
    try {
      return parseAndValidateJson(input);
    } catch (_) {
      // 2) Plaintext fallback
      const deck = parsePlaintextQuiz(input);
      return validateDeck(deck);
    }
  }

  function stripInlineMarkdown(s) {
    return (s || "")
      // bold/italic markers
      .replace(/\*\*(.*?)\*\*/g, "$1")
      .replace(/__(.*?)__/g, "$1")
      .replace(/\*(.*?)\*/g, "$1")
      .replace(/_(.*?)_/g, "$1")
      // inline code
      .replace(/`([^`]+)`/g, "$1")
      // collapse whitespace
      .replace(/\s+/g, " ")
      .trim();
  }

  function parsePlaintextQuiz(raw) {
    const original = (raw || "").replace(/\r\n/g, "\n").trim();
    if (!original) throw new Error("Paste a quiz first.");

    // ---- Split into question part vs answer-key part (markdown-tolerant, colon optional)
    const keyHeaderRe =
      /^\s*(?:#{1,6}\s*)?(?:\*\*)?\s*(answer\s*key|answers)\s*:?\s*(?:\*\*)?\s*$/im;

    const keyMatch = keyHeaderRe.exec(original);
    if (!keyMatch) {
      throw new Error("Couldn’t find an Answer Key heading at the end of the quiz.");
    }
    const questionTextRaw = keyMatch ? original.slice(0, keyMatch.index).trim() : original;
    const answerText = original.slice(keyMatch.index).trim();

    const answers = parseAnswerKey(answerText);

    // ---- Normalize question numbering so headings like "### **1.**" become "1. "
    // This lets the existing block slicer work reliably.
    const qLines = questionTextRaw.split("\n");
    const qHeaderLineRe = /^\s*(?:#{1,6}\s*)?(?:\*\*)?\s*(\d{1,3})\s*[\.)]?\s*(?:\*\*)?\s*$/i;

    const normalizedLines = qLines.map(line => {
      const m = line.match(qHeaderLineRe);
      if (m) return `${m[1]}.`; // becomes a clean "1."
      return line;
    });

    const questionText = normalizedLines.join("\n");

    // ---- Find question starts like "1." or "1)"
    const qStart = /^\s*(\d+)\s*[.)]\s*$/gm;     // line that is just "1." after normalization
    const qStartInline = /^\s*(\d+)\s*[.)]\s+/gm; // also supports "1. Stem..." in one line

    // Collect starts from BOTH patterns
    const starts = [];

    let m1;
    while ((m1 = qStart.exec(questionText)) !== null) {
      starts.push({ index: m1.index, qNum: Number(m1[1]), type: "line" });
    }
    let m2;
    while ((m2 = qStartInline.exec(questionText)) !== null) {
      starts.push({ index: m2.index, qNum: Number(m2[1]), type: "inline" });
    }

    // sort & de-dup (sometimes "1." could match both if oddly formatted)
    starts.sort((a, b) => a.index - b.index);
    const deduped = [];
    for (const s of starts) {
      if (deduped.length === 0 || deduped[deduped.length - 1].index !== s.index) deduped.push(s);
    }

    if (deduped.length === 0) {
      throw new Error(
        "Couldn’t find any numbered questions.\n\nExpected something like:\n" +
        "1. Question...\nA. ...\nB. ...\nC. ...\nD. ...\nE. ..."
      );
    }

    // ---- Slice blocks
    const blocks = deduped.map((s, i) => {
      const end = (i + 1 < deduped.length) ? deduped[i + 1].index : questionText.length;
      return { qNum: s.qNum, block: questionText.slice(s.index, end).trim() };
    });

    const questions = blocks.map(({ qNum, block }) => {
      const lines = block.split("\n");

      // Remove the leading "N." line OR strip "N. " prefix if inline
      if (/^\s*\d+\s*[.)]\s*$/.test(lines[0])) {
        lines.shift(); // drop the standalone "1."
      } else {
        lines[0] = lines[0].replace(/^\s*\d+\s*[.)]\s+/, "");
      }

      // Choices: allow optional bullets/indentation and markdown around the label
      // Accept: "A. text", "A) text", also "- A. text"
      const choiceRe = /^\s*(?:[-*]\s*)?(?:\*\*)?\s*([A-E])\s*(?:\*\*)?\s*[\)\.\:\-]\s+(.*\S)\s*$/;

      const stemLines = [];
      const choiceMap = {};
      let lastChoiceLetter = null;
      let inChoices = false;

      for (const line of lines) {
        const mm = line.match(choiceRe);
        if (mm) {
          inChoices = true;
          lastChoiceLetter = mm[1];
          const t = mm[2].trim();
          choiceMap[lastChoiceLetter] = choiceMap[lastChoiceLetter]
            ? (choiceMap[lastChoiceLetter] + " " + t)
            : t;
          continue;
        }

        const trimmed = line.trim();
        if (!trimmed) continue;

        // Ignore horizontal rules / separators
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) continue;

        if (!inChoices) {
          stemLines.push(trimmed);
        } else if (lastChoiceLetter) {
          // allow wrapped choice lines
          choiceMap[lastChoiceLetter] += " " + trimmed;
        }
      }

      let stem = stemLines.join(" ").trim();
      if (!stem) throw new Error(`Question ${qNum}: missing stem text.`);

      // Clean inline markdown from stem/choices (optional but matches your “no markdown” preference)
      stem = stripInlineMarkdown(stem);

      const lettersAE = ["A","B","C","D","E"];
      const choices = lettersAE.map(L => stripInlineMarkdown((choiceMap[L] || "").trim()));
      const nonEmpty = choices.filter(Boolean).length;

      if (nonEmpty !== 5) {
        throw new Error(
          `Question ${qNum}: expected 5 choices labeled A–E, found ${nonEmpty}.\n\n` +
          `Make sure choices look like:\nA. ...\nB. ...\nC. ...\nD. ...\nE. ...`
        );
      }

      const ansLetter = answers.get(qNum);
      if (!ansLetter) {
        throw new Error(
          `Missing answer for Question ${qNum} in the answer key.\n\n` +
          `Add something like:\nAnswer Key\n${qNum}. B`
        );
      }

      const answerIndex = "ABCDE".indexOf(ansLetter);
      if (answerIndex < 0) throw new Error(`Question ${qNum}: invalid answer letter "${ansLetter}".`);

      return { stem, choices, answerIndex };
    });

    return { questions };
  }

  function parseAnswerKey(answerSectionText) {
    const t = (answerSectionText || "")
      .replace(/\r\n/g, "\n")
      // normalize separators so "1-B, 2-B" → "1-B\n2-B"
      .replace(/,/g, "\n");

    // Matches:
    // 1. B
    // 1-B
    // 1) **B**
    // 10: C
    const pairRe =
      /(\d{1,3})\s*[\)\.\:\-]\s*(?:\*\*)?\s*([A-E])\s*(?:\*\*)?/gi;

    const map = new Map();
    let m;

    while ((m = pairRe.exec(t)) !== null) {
      map.set(Number(m[1]), m[2].toUpperCase());
    }

    if (map.size === 0) {
      throw new Error(
        "Couldn’t find an answer key.\n\nExpected formats like:\n" +
        "1. B\n2. C\n\nor\n\n1-B, 2-C, 3-A"
      );
    }

    return map;
  }

  function setView(which) {
    landingEl.classList.toggle("hidden", which !== "landing");
    quizEl.classList.toggle("hidden", which !== "quiz");
    endEl.classList.toggle("hidden", which !== "end");
  }

  function updateProgress() {
    const total = deck.questions.length;
    const reviewPosition = reviewIndices ? reviewIndices.indexOf(idx) : -1;
    const current = reviewPosition >= 0 ? reviewPosition + 1 : idx + 1;
    const visibleTotal = reviewIndices ? reviewIndices.length : total;
    const pct = (current / visibleTotal) * 100;
    progressBar.style.width = pct + "%";
    topMeta.textContent = reviewIndices
      ? `Incorrect ${current} / ${visibleTotal} • Question ${idx + 1} / ${total}`
      : `${current} / ${total}`;
    if (excluded[idx]) topMeta.textContent += " • Excluded from grade";
  }

  function renderQuestion() {
    const q = deck.questions[idx];
    updateProgress();

    stemEl.textContent = q.stem;
    choicesEl.innerHTML = "";

    const isLocked = locked[idx] === true;
    const sel = selected[idx];
    excludeBtn.textContent = excluded[idx] ? "Include in Grade" : "Exclude from Grade";
    excludeBtn.setAttribute("aria-pressed", String(excluded[idx]));
    excludeBtn.classList.toggle("danger", excluded[idx]);

    q.choices.forEach((text, choiceIndex) => {
      const row = document.createElement("div");
      row.className = "choiceRow";

      const btn = document.createElement("button");
      btn.className = "choiceBtn";
      btn.type = "button";
      const isEliminated = eliminated[idx][choiceIndex];
      if (isEliminated) btn.classList.add("eliminated");
      btn.disabled = isEliminated || isLocked;

      // outlines after lock
      if (isLocked) {
        const correct = q.answerIndex;

        // outline what they picked
        if (choiceIndex === sel) {
          btn.classList.add(sel === correct ? "outlineGood" : "outlineBad");
        }

        // if they were wrong, ALSO outline the correct choice
        if (sel !== correct && choiceIndex === correct) {
          btn.classList.add("outlineGood");
        }
      }

      const choiceText = document.createElement("div");
      choiceText.className = "choiceText";
      choiceText.textContent = `${letters[choiceIndex]}. ${text}`;
      btn.appendChild(choiceText);
      btn.addEventListener("click", () => {
        if (locked[idx] || eliminated[idx][choiceIndex]) return;

        selected[idx] = choiceIndex;
        locked[idx] = true;
        renderQuestion();
      });

      const eliminateBtn = document.createElement("button");
      eliminateBtn.className = "eliminateBtn";
      eliminateBtn.type = "button";
      eliminateBtn.textContent = "👁";
      eliminateBtn.disabled = isLocked;
      eliminateBtn.setAttribute("aria-pressed", String(isEliminated));
      eliminateBtn.setAttribute(
        "aria-label",
        `${isEliminated ? "Restore" : "Eliminate"} answer ${letters[choiceIndex]}`
      );
      eliminateBtn.title = isEliminated ? "Restore answer" : "Eliminate answer";
      eliminateBtn.addEventListener("click", () => {
        if (locked[idx]) return;
        eliminated[idx][choiceIndex] = !eliminated[idx][choiceIndex];
        renderQuestion();
      });

      row.appendChild(btn);
      row.appendChild(eliminateBtn);
      choicesEl.appendChild(row);
    });

    explainBtn.disabled = !locked[idx];

    const reviewPosition = reviewIndices ? reviewIndices.indexOf(idx) : -1;
    const last = reviewIndices
      ? reviewPosition === reviewIndices.length - 1
      : idx === deck.questions.length - 1;

    prevBtn.disabled = reviewIndices ? reviewPosition === 0 : idx === 0;
    nextBtn.disabled = false;                 // keep enabled
    nextBtn.textContent = last ? "Done" : "Next";
  }

  function computeScore() {
    let right = 0;
    let total = 0;
    let excludedCount = 0;
    deck.questions.forEach((q, i) => {
      if (excluded[i]) {
        excludedCount++;
        return;
      }
      total++;
      if (locked[i] && selected[i] === q.answerIndex) right++;
    });
    return { right, total, excludedCount };
  }

  function goEnd() {
    const { right, total, excludedCount } = computeScore();
    const pct = total ? Math.round((right / total) * 100) : 0;

    endPill.textContent = `${right}/${total}`;
    endPercent.textContent = `${pct}%`;
    endDetail.textContent = `You got ${right} right out of ${total}.` +
      (excludedCount ? ` ${excludedCount} question${excludedCount === 1 ? " was" : "s were"} excluded.` : "");
    reviewIncorrectBtn.disabled = right === total;
    reviewIndices = null;

    setView("end");
  }

  function copyExplainPrompt() {
    const q = deck.questions[idx];
    const sel = selected[idx];
    const selLetter = (sel === null || sel === undefined) ? "None" : letters[sel];

    const prompt =
`Explain this multiple-choice question and why each option is right/wrong. Keep it concise and Step/COMLEX-style.

Question:
${q.stem}

Choices:
A. ${q.choices[0]}
B. ${q.choices[1]}
C. ${q.choices[2]}
D. ${q.choices[3]}
E. ${q.choices[4]}

My answer: ${selLetter}
`;

    copyToClipboard(prompt, "Copied!", explainBtn);
  }

  // ---------- Events ----------
  startBtn.addEventListener("click", () => {
    clearError();
    try {
      deck = parseAndValidateFlexible(jsonInput.value.trim());

      if (shuffleQuestionsInput.checked) shuffleInPlace(deck.questions);

      // 🔀 shuffle answers once per "Start"
      shuffleChoicesInDeck(deck);

      idx = 0;
      selected = new Array(deck.questions.length).fill(null);
      locked = new Array(deck.questions.length).fill(false);
      eliminated = Array.from({ length: deck.questions.length }, () => new Array(5).fill(false));
      excluded = new Array(deck.questions.length).fill(false);
      reviewIndices = null;
      setView("quiz");
      renderQuestion();
    } catch (e) {
      showError(e.message);
    }
  });

  clearBtn.addEventListener("click", () => {
    jsonInput.value = "";
    clearError();
  });

  // tutorial modal events
  tutorialBtn.addEventListener("click", () => {
    clearError();
    openTutorial();
  });

  tutorialClose.addEventListener("click", closeTutorial);

  tutorialOverlay.addEventListener("click", (e) => {
    if (e.target === tutorialOverlay) closeTutorial();
  });

  copyExampleBtn.addEventListener("click", () => {
    copyToClipboard(EXAMPLE_PROMPT, "Copied!", copyExampleBtn);
  });

  // saved banks modal events
  savedBtn.addEventListener("click", () => {
    clearError();
    openSaved();
  });

  savedClose.addEventListener("click", closeSaved);

  savedOverlay.addEventListener("click", (e) => {
    if (e.target === savedOverlay) closeSaved();
  });

  saveBtn.addEventListener("click", saveCurrentBank);

  prevBtn.addEventListener("click", () => {
    if (reviewIndices) {
      const position = reviewIndices.indexOf(idx);
      if (position > 0) {
        idx = reviewIndices[position - 1];
        renderQuestion();
      }
    } else if (idx > 0) {
      idx--;
      renderQuestion();
    }
  });

  nextBtn.addEventListener("click", () => {
    if (reviewIndices) {
      const position = reviewIndices.indexOf(idx);
      if (position === reviewIndices.length - 1) return goEnd();
      idx = reviewIndices[position + 1];
    } else {
      const last = (idx === deck.questions.length - 1);
      if (last) return goEnd();
      idx++;
    }
    renderQuestion();
  });

  explainBtn.addEventListener("click", () => copyExplainPrompt());

  excludeBtn.addEventListener("click", () => {
    excluded[idx] = !excluded[idx];
    if (reviewIndices && excluded[idx]) {
      const position = reviewIndices.indexOf(idx);
      reviewIndices.splice(position, 1);
      if (!reviewIndices.length) return goEnd();
      idx = reviewIndices[Math.min(position, reviewIndices.length - 1)];
    }
    renderQuestion();
  });

  restartBtn.addEventListener("click", () => {
    deck = null;
    idx = 0;
    selected = [];
    locked = [];
    eliminated = [];
    excluded = [];
    reviewIndices = null;
    setView("landing");
    jsonInput.focus();
  });

  reviewBtn.addEventListener("click", () => {
    reviewIndices = null;
    idx = 0;
    setView("quiz");
    renderQuestion();
  });

  reviewIncorrectBtn.addEventListener("click", () => {
    reviewIndices = deck.questions
      .map((q, questionIndex) =>
        excluded[questionIndex] || selected[questionIndex] === q.answerIndex ? null : questionIndex
      )
      .filter(questionIndex => questionIndex !== null);
    if (!reviewIndices.length) return;
    idx = reviewIndices[0];
    setView("quiz");
    renderQuestion();
  });

  // keyboard shortcuts
  document.addEventListener("keydown", (e) => {
    // close modals with Esc
    if (e.key === "Escape") {
      if (tutorialOverlay.style.display === "flex") { closeTutorial(); return; }
      if (savedOverlay && savedOverlay.style.display === "flex") { closeSaved(); return; }
      if (!quizEl.classList.contains("hidden")) {
        deck = null;
        idx = 0;
        selected = [];
        locked = [];
        eliminated = [];
        excluded = [];
        reviewIndices = null;
        setView("landing");
        jsonInput.focus();
        return;
      }
    }

    const openModal = [tutorialOverlay, savedOverlay]
      .find(overlay => overlay.style.display === "flex");
    if (openModal) {
      if (e.key === "Tab") {
        const focusable = [...openModal.querySelectorAll("button, textarea, [tabindex]:not([tabindex='-1'])")]
          .filter(el => !el.disabled);
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
      return;
    }

    if (quizEl.classList.contains("hidden")) return;

    if (e.key >= "1" && e.key <= "5" && !locked[idx]) {
      const choiceIndex = Number(e.key) - 1;
      if (eliminated[idx][choiceIndex]) return;
      selected[idx] = choiceIndex;
      locked[idx] = true;
      renderQuestion();
    }
    if (e.key === "ArrowLeft") prevBtn.click();
    if (e.key === "ArrowRight") nextBtn.click();
  });
</script>
</body>
</html>
